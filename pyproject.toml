[project]
name = "agentready"
version = "1.0.0"
description = "Workshop: Construindo Dados Prontos para IA Agêntica — caso de marketing (otimização de orçamento de mídia)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "mcp>=2.0",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
dev = ["pytest>=8"]

[project.scripts]
agentready = "agentready.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
