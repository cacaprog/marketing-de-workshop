# Casos da política de guardrails (Fase 4) — UMA lista para os dois avaliadores:
#   - `opa test` (stack/policy/testes/guardrails_test.rego percorre data.casos);
#   - o teste de equivalência (stack/tests/test_policy_equivalence.py): Python local × OPA, caso a caso.
# Cada guardrail tem pelo menos um caso que passa e um que falha; os limites exatos (±20%, mínimo, teto) estão aqui.
# Os limites usados são os de config/guardrails.yaml (nada é copiado para cá).
