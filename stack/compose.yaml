# Trilha stack — Airflow 3.3 (LocalExecutor) + Postgres (metadados do Airflow).
# Baseado no docker-compose oficial do Airflow 3.3, reduzido: sem Celery/Redis/worker/triggerer.
# Rode a partir de stack/:  make up   (ou: docker compose up -d --wait)
name: aurora-stack

x-airflow-common: &airflow-common
  image: aurora-stack-airflow:fase1     # construída uma vez pelo airflow-init (abaixo)
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    TZ: ${TZ:-America/Sao_Paulo}
    HOME: /home/airflow                 # o Airflow está em $HOME/.local (venv do usuário airflow)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-America/Sao_Paulo}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-somente-para-estudo-local-troque-em-producao}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: instrutor:admin,aprovadora:op
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
    STACK_CONFIG: /opt/airflow/config/stack.yaml
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # só para brain=claude (opcional); a demo padrão não usa
    AGENTREADY_MODEL: ${AGENTREADY_MODEL:-}   # vazio = padrão do agent.py (um único lugar)
    # Fase 2 — linhagem: o provider OpenLineage do Airflow (e o Cosmos, nas tarefas dbt) envia eventos
    # ao Marquez. Se o Marquez cair, as tarefas NÃO falham (só registram no log; FR-013).
    AIRFLOW__OPENLINEAGE__NAMESPACE: aurora
    AIRFLOW__OPENLINEAGE__CUSTOM_RUN_FACETS: _lineage_facets.trace_facet   # trace_id do agente (FR-010)
    # Sem retentativas: com o Marquez fora do ar, cada evento falha na hora (com retentativa e backoff, uma
    # execução levou 437 s em vez de 155 s no `make test-live`). Linhagem nunca segura o pipeline (FR-013).
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:5000", "endpoint": "api/v1/lineage", "timeout": 5, "retry": {"total": 0}}'
    MARQUEZ_URL: http://marquez-api:5000
    # Fase 3 — traces: o Airflow (execução e tarefas), as tarefas da stack e o agente (tracing.py, inalterado)
    # mandam spans ao coletor, que guarda em disco se o Phoenix cair. Se o COLETOR cair, nenhuma tarefa falha
    # (FR-012): o envio desiste rápido e as decisões continuam no log de auditoria (make auditoria).
    AIRFLOW__TRACES__OTEL_ON: "True"
    AIRFLOW__TRACES__TASK_RUNNER_FLUSH_TIMEOUT_MILLISECONDS: "3000"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_TRACES_EXPORTER: otlp_proto_http      # as tarefas (task SDK) escolhem o exportador por aqui; o padrão "otlp" é gRPC
    OTEL_EXPORTER_OTLP_TIMEOUT: "2"            # segundos no SDK Python (conferido no spike T007): desiste rápido se o coletor cair
    OTEL_SERVICE_NAME: airflow                 # o run_stack() tira esta variável dos subprocessos
    PHOENIX_PORT: ${PHOENIX_PORT:-6006}
    PHOENIX_INTERNAL_URL: http://phoenix:6006
    MARQUEZ_WEB_PORT: ${MARQUEZ_WEB_PORT:-3000}
    REPORT_PORT: ${REPORT_PORT:-8090}
    # Fase 4 — camadas de dados no DuckLake (catálogo no Postgres, arquivos em data/lake/); estado operacional
    # (orçamentos, change log, aprovações) no ops.duckdb, fora dos snapshots. Bloco: contracts/dag-interface.md.
    AGENTREADY_DB: /opt/stack-data/ops.duckdb
    STACK_LAKE_CATALOG: postgres:dbname=ducklake host=postgres user=ducklake password=ducklake
    STACK_LAKE_DATA: /opt/stack-data/lake/
    UPSTREAM_URL: http://upstream:8000             # fontes simuladas (rotas públicas)
    UPSTREAM_ADMIN_URL: http://upstream:8001       # rotas de administração: só a rede interna (nunca publicada)
    OPA_URL: http://opa:8181
    # Fase 4 (Bloco 3): guardrails decididos pelo OPA; sem OPA, nenhuma escrita (falha fechada).
    AGENTREADY_POLICY_EVALUATOR: agentready_stack.policy_opa:OpaEvaluator
    RUNTIME__DLTHUB_TELEMETRY: "false"             # dlt: telemetria anônima desligada (FR-020)
    AIRFLOW__COSMOS__ENABLE_TELEMETRY: "false"     # Cosmos: sem métricas para scarf.sh a cada tarefa dbt (FR-020)
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"        # dbt-core: sem estatísticas anônimas de uso (FR-020)
    DO_NOT_TRACK: "1"                              # convenção que Cosmos e dbt também respeitam
  volumes:
    - ..:/opt/agentready:ro             # fonte única: código, contratos, config, corpus
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt            # leitura/escrita: testes gerados e target/
    - ./config:/opt/airflow/config
    - ./data:/opt/stack-data            # warehouse e traces desta trilha (separados da trilha padrão)
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build:
      context: ..                       # raiz do repo (para instalar o agentready)
      dockerfile: stack/Dockerfile
    # Mantém o entrypoint oficial (ele registra o UID arbitrário como usuário); "bash -c" é suportado.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/stack-data/traces /opt/stack-data/elementary /opt/stack-data/otel-queue /opt/stack-data/lake /opt/stack-data/upstream
        [ -f /opt/stack-data/elementary/index.html ] || printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Observabilidade</title><p>Relatório ainda não gerado — rode o DAG <code>aurora_midia_diario</code> (<code>make run</code>).</p>' > /opt/stack-data/elementary/index.html
        airflow db migrate
        airflow pools set duckdb_writer 1 "Escrita no warehouse DuckDB: um escritor por vez (FR-007)"
        /opt/agentready/stack/scripts/contracts-sync.sh
        echo "init concluído"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Fase 2: linhagem e observabilidade
  db-init:
    # Fases 2 e 3: cria, de forma idempotente, os bancos do Marquez e do Phoenix no MESMO Postgres
    # (roda todos os postgres-init/*.sql em ordem, a cada `make up`).
    image: postgres:16
    environment:
      PGPASSWORD: airflow
    volumes:
      - ./postgres-init:/sql:ro
    entrypoint: ["sh", "-c"]
    command: ['for f in /sql/*.sql; do echo "aplicando $$f"; psql -v ON_ERROR_STOP=1 -h postgres -U airflow -d airflow -f "$$f" || exit 1; done']
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  marquez-api:
    image: marquezproject/marquez:0.50.0    # projeto ativo; última versão publicada 0.50.0 (out/2024)
    environment:
      MARQUEZ_CONFIG: marquez.dev.yml
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SEARCH_ENABLED: "false"                # sem OpenSearch: economiza um serviço pesado (busca não é usada)
      JAVA_OPTS: -Xmx512m
    # Sem porta no host: a API só é usada dentro da rede (a 5000 colide com o AirPlay no macOS).
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "${MARQUEZ_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      marquez-api:
        condition: service_healthy

  relatorio:
    # Serve o relatório web do Elementary (gerado pela tarefa observabilidade.relatorio a cada execução).
    image: aurora-stack-airflow:fase1
    pull_policy: never
    entrypoint: ["/usr/python/bin/python3.12", "-m", "http.server", "8090", "-d", "/opt/stack-data/elementary"]
    volumes:
      - ./data:/opt/stack-data:ro
    ports:
      - "${REPORT_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Fase 3: traces
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    user: "${AIRFLOW_UID:-50000}:0"          # a fila em disco (data/otel-queue) fica com o seu usuário
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./data/otel-queue:/var/lib/otelcol/queue
    # Sem porta no host (só a rede interna). A imagem não tem shell nem curl, então não há healthcheck
    # aqui: a saúde (extensão health_check, :13133) é conferida pelo fechamento de cada execução.
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-22.0.1-nonroot
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:phoenix@postgres:5432/phoenix
      PHOENIX_PORT: 6006
      PHOENIX_TELEMETRY_ENABLED: "false"            # sem telemetria de uso (FR-017)
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"     # sem fontes/downloads externos: funciona offline
      PHOENIX_DISABLE_MODEL_COST_AUTO_UPDATE: "true"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"       # o assistente embutido exigiria chave e rede
      # Sem login, como as outras UIs da stack (só estudo local). O Phoenix 22 liga a autenticação sozinho
      # quando escuta fora do loopback (0.0.0.0 no container), então desligamos de forma explícita.
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Fase 4: fontes, política
  upstream:
    # As quatro fontes simuladas da Aurora (ads, ga4, Meta, catálogo), servidas a partir do gerador compartilhado.
    # Um processo, duas portas: 8000 = rotas das fontes + /docs (só 127.0.0.1); 8001 = administração (rede interna).
    image: aurora-stack-airflow:fase1
    pull_policy: never
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["/opt/venvs/agent/bin/python", "-m", "agentready_stack.upstream_app"]
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      HOME: /home/airflow
      AGENTREADY_HOME: /opt/agentready
      AGENTREADY_DB: /opt/stack-data/upstream/fontes.duckdb   # o "mundo de fora": nunca o ops.duckdb nem o lake
    volumes:
      - ..:/opt/agentready:ro
      - ./data/upstream:/opt/stack-data/upstream
    ports:
      - "127.0.0.1:${UPSTREAM_PORT:-8000}:8000"     # só no host local (FR-020); a 8001 nunca é publicada
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/admin/saude"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  opa:
    # Guardrails como política (Bloco 3): a política Rego em stack/policy/ e os LIMITES lidos do arquivo
    # compartilhado config/guardrails.yaml (data.guardrails), nunca copiados. Sem porta no host.
    # A imagem estática não tem shell nem curl: não há healthcheck; o preflight do agente confere a política.
    image: openpolicyagent/opa:1.22.4-static
    command: ["run", "--server", "--disable-telemetry", "--addr", ":8181", "/policy/guardrails.rego",
              "guardrails:/config/guardrails.yaml"]
    volumes:
      - ./policy:/policy:ro
      - ../config:/config:ro
    restart: unless-stopped
