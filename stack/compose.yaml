# Trilha stack — Airflow 3.3 (LocalExecutor) + Postgres (metadados do Airflow).
# Baseado no docker-compose oficial do Airflow 3.3, reduzido: sem Celery/Redis/worker/triggerer.
# Rode a partir de stack/:  make up   (ou: docker compose up -d --wait)
name: aurora-stack

x-airflow-common: &airflow-common
  image: aurora-stack-airflow:fase1     # construída uma vez pelo airflow-init (abaixo)
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    TZ: ${TZ:-America/Sao_Paulo}
    HOME: /home/airflow                 # o Airflow está em $HOME/.local (venv do usuário airflow)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-America/Sao_Paulo}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-somente-para-estudo-local-troque-em-producao}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: instrutor:admin,aprovadora:op
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
    STACK_CONFIG: /opt/airflow/config/stack.yaml
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # só para brain=claude (opcional); a demo padrão não usa
    AGENTREADY_MODEL: ${AGENTREADY_MODEL:-}   # vazio = padrão do agent.py (um único lugar)
    # Fase 2 — linhagem: o provider OpenLineage do Airflow (e o Cosmos, nas tarefas dbt) envia eventos
    # ao Marquez. Se o Marquez cair, as tarefas NÃO falham (só registram no log; FR-013).
    AIRFLOW__OPENLINEAGE__NAMESPACE: aurora
    AIRFLOW__OPENLINEAGE__CUSTOM_RUN_FACETS: _lineage_facets.trace_facet   # trace_id do agente (FR-010)
    # Sem retentativas: com o Marquez fora do ar, cada evento falha na hora (com retentativa e backoff, uma
    # execução levou 437 s em vez de 155 s no `make test-live`). Linhagem nunca segura o pipeline (FR-013).
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:5000", "endpoint": "api/v1/lineage", "timeout": 5, "retry": {"total": 0}}'
    MARQUEZ_URL: http://marquez-api:5000
    MARQUEZ_WEB_PORT: ${MARQUEZ_WEB_PORT:-3000}
    REPORT_PORT: ${REPORT_PORT:-8090}
  volumes:
    - ..:/opt/agentready:ro             # fonte única: código, contratos, config, corpus
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt            # leitura/escrita: testes gerados e target/
    - ./config:/opt/airflow/config
    - ./data:/opt/stack-data            # warehouse e traces desta trilha (separados da trilha padrão)
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build:
      context: ..                       # raiz do repo (para instalar o agentready)
      dockerfile: stack/Dockerfile
    # Mantém o entrypoint oficial (ele registra o UID arbitrário como usuário); "bash -c" é suportado.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/stack-data/traces /opt/stack-data/elementary
        [ -f /opt/stack-data/elementary/index.html ] || printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Observabilidade</title><p>Relatório ainda não gerado — rode o DAG <code>aurora_midia_diario</code> (<code>make run</code>).</p>' > /opt/stack-data/elementary/index.html
        airflow db migrate
        airflow pools set duckdb_writer 1 "Escrita no warehouse DuckDB: um escritor por vez (FR-007)"
        /opt/agentready/stack/scripts/contracts-sync.sh
        echo "init concluído"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Fase 2: linhagem e observabilidade
  marquez-db-init:
    image: postgres:16
    environment:
      PGPASSWORD: airflow
    volumes:
      - ./postgres-init:/sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "airflow", "-d", "airflow", "-f", "/sql/01-marquez.sql"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  marquez-api:
    image: marquezproject/marquez:0.50.0    # projeto ativo; última versão publicada 0.50.0 (out/2024)
    environment:
      MARQUEZ_CONFIG: marquez.dev.yml
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SEARCH_ENABLED: "false"                # sem OpenSearch: economiza um serviço pesado (busca não é usada)
      JAVA_OPTS: -Xmx512m
    # Sem porta no host: a API só é usada dentro da rede (a 5000 colide com o AirPlay no macOS).
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    depends_on:
      marquez-db-init:
        condition: service_completed_successfully

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    ports:
      - "${MARQUEZ_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      marquez-api:
        condition: service_healthy

  relatorio:
    # Serve o relatório web do Elementary (gerado pela tarefa observabilidade.relatorio a cada execução).
    image: aurora-stack-airflow:fase1
    pull_policy: never
    entrypoint: ["/usr/python/bin/python3.12", "-m", "http.server", "8090", "-d", "/opt/stack-data/elementary"]
    volumes:
      - ./data:/opt/stack-data:ro
    ports:
      - "${REPORT_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

