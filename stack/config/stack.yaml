# Configuração da trilha stack (lida pelo DAG e pelas tarefas).
version: 1.0.0
schedule: "0 7 * * *"          # 07:00 no fuso do container (TZ)
approvals:
  # 20h, não 24h: um pedido sem resposta expira antes da execução do dia seguinte.
  # Com max_active_runs=1, uma execução ainda esperando aprovação seguraria a próxima.
  response_timeout: "20h"
  approvers: ["aprovadora"]    # só estes usuários podem responder (segregação de funções)
alert:
  new_only: true               # o alerta de qualidade só falha com problemas NOVOS (pesquisa R7)
observability:
  # Fase 2. As faixas COPIAM VOLUME_BAND e DISTRIBUTION_BAND de src/agentready/observability.py;
  # se alguém mudar uma das duas, `make parity` mostra a diferença (pesquisa R2).
  bands:
    volume: [0.5, 1.5]          # lote de ontem fora de 50%-150% da mediana dos 14 dias anteriores
    distribution: [0.5, 2.0]    # ticket médio do lote fora de 0,5x-2x da mediana histórica
  # Menos pontos que isso na linha de base = "histórico insuficiente" (aviso, nunca bloqueia; pesquisa R7).
  min_history: 7
