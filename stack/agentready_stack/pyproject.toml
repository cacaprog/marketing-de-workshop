[project]
name = "agentready-stack"
version = "0.1.0"
description = "Trilha stack do workshop agentready: tarefas do DAG, aprovações, ledger e paridade."
requires-python = ">=3.11"
# Sem dependências declaradas DE PROPÓSITO: existe um pacote "agentready" sem relação no PyPI.
# O agentready deste repositório é instalado ao lado (pip/uv install -e <raiz do repo>), nunca resolvido do PyPI.
dependencies = []

[project.scripts]
agentready-stack = "agentready_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentready_stack"]
